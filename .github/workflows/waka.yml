name: Waka Readme

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest

    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # 显示语言
          LOCALE: "en"

          # GitHub 提交统计
          # 一天内提交时间分布
          SHOW_COMMIT: "True"
          # 一周内提交日期分布
          SHOW_DAYS_OF_WEEK: "True"

          # WakaTime 开发统计
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "False"
          SHOW_OS: "False"
          SHOW_TIMEZONE: "True"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_PROJECTS: "False"

          # 其他统计
          SHOW_PROFILE_VIEWS: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_LOC_CHART: "False"
          SHOW_LANGUAGE_PER_REPO: "False"

          # AI 编程统计
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"

          # 进度条样式
          BAR_STYLE: "text"
          SYMBOL_VERSION: "1"

          # 更新时间
          SHOW_UPDATED_DATE: "True"
          UPDATED_DATE_FORMAT: "%Y-%m-%d %H:%M"

          # 自动提交
          COMMIT_BY_ME: "False"
          COMMIT_SINGLE: "False"
          COMMIT_MESSAGE: "chore: update WakaTime metrics"